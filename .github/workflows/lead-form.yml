name: Lead form checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Install browser test tools without changing the lockfile
        run: npm install --no-save --package-lock=false @playwright/test@1.65.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
